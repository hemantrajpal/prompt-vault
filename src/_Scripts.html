<script>
const appState={committed:{prompts:[],categories:[],settings:{}},draft:null,baseRecord:null,saveIntent:null,dirty:false,useInputs:{},page:'library',categoryId:null,requestState:'loading',layout:'grid'};
const $=id=>document.getElementById(id);
function preferenceKey(){const s=appState.committed.settings;return 'prompt-vault:'+s.installId+':'+s.ownerEmail;}
function preferences(){try{return JSON.parse(localStorage.getItem(preferenceKey())||'{}');}catch(_){return {};}}
function setPreference(key,value){try{localStorage.setItem(preferenceKey(),JSON.stringify({...preferences(),[key]:value}));}catch(_){} }
function setTheme(theme){document.documentElement.classList.toggle('dark',theme!=='light');$('theme-btn').replaceChildren(iconsax(theme==='light'?'moon':'sun-1'));setPreference('theme',theme);}
function renderNav(){
 const navIcons={library:'element-3',categories:'category',archive:'archive',settings:'setting-2'};
 const nav=$('main-nav');nav.replaceChildren();
 for(const [name,label] of [['library','All prompts'],['categories','Categories'],['archive','Archive'],['settings','Settings & backup']]){
  const b=action(label,()=>{if(name==='library')appState.categoryId=null;navigate(name);},'ghost',navIcons[name]);b.classList.add('nav-btn');if(appState.page===name)b.setAttribute('aria-current','page');nav.append(b);
 }
 const cats=$('sidebar-cats');cats.replaceChildren();for(const c of appState.committed.categories.filter(c=>c.status==='active'))cats.append(action(c.name,()=>{appState.categoryId=c.id;navigate('library');},'ghost','folder-open'));
 $('user-email-display').replaceChildren(iconsax('user'),uiText('span',appState.committed.settings.ownerEmail||''));
}
async function loadVault(){
 appState.requestState='loading';announce('Loading your vault…');
 try{appState.committed=await vaultApi.call('getVaultV2');appState.requestState='ready';setTheme(preferences().theme||'dark');renderNav();announce('');renderCurrent();}
 catch(e){appState.requestState=e.code==='ACCESS_DENIED'?'denied':'failed';announce(e.message,'error');const panel=uiText('section',null,{className:'panel'});panel.append(uiText('h2',appState.requestState==='denied'?'Access denied':'Couldn’t load your vault'),uiText('p','Your saved records have not been replaced.'),action('Try again',loadVault));$('view').replaceChildren(panel);}
}
async function navigate(page,record){
 if(appState.requestState==='saving'){announce('Wait for the current save to finish.');return;}
 if(appState.dirty&&!(await confirmAction('Discard the unsaved draft? Choose Close to keep editing.')))return;
 appState.page=page;appState.dirty=false;appState.draft=null;appState.saveIntent=null;appState.baseRecord=record||null;appState.useInputs={};
 setSidebarOpen(false);
 $('topbar-title').textContent=({library:'All prompts',archive:'Archive',categories:'Categories',editor:record?'Edit prompt':'New prompt',use:'Use prompt',settings:'Settings & backup'})[page]||'Prompt Vault';
 renderNav();renderCurrent();$('content-area').focus();
}
function renderCurrent(){
 const descriptions={library:'A useful starting point for your next task.',archive:'Keep your library focused. Restore a prompt whenever you need it.',use:'Fill your facts, check the preview, and make it yours.',editor:'Capture a repeatable process. Keep the inputs clear.',categories:'Give every prompt a place that makes sense.',settings:'Your installation, your records, your recovery options.'};
 $('page-description').textContent=descriptions[appState.page]||'';
 $('layout-controls').hidden=!['library','archive'].includes(appState.page);

 if(appState.page==='editor')renderEditorView(appState.baseRecord);
 else if(appState.page==='use')renderUseView(appState.baseRecord);
 else if(appState.page==='categories')renderCategoriesView();
 else if(appState.page==='settings')renderSettingsView();
 else renderLibraryView({records:appState.committed.prompts,query:$('search-input').value,filters:{categoryId:appState.categoryId},status:appState.requestState});
}
function renderLibraryView({records,query='',filters={},status='ready'}){
 const view=$('view'),grid=uiText('div',null,{id:'library-grid'});grid.dataset.layout=appState.layout;view.replaceChildren(grid);
 const controls=$('layout-controls');controls.replaceChildren();
 for(const [mode,name] of [['grid','element-3'],['list','row-vertical']]){const b=action(mode==='grid'?'Grid view':'List view',()=>{appState.layout=mode;renderCurrent();},'ghost',name);b.classList.add('icon-button');b.setAttribute('aria-pressed',String(mode===appState.layout));controls.append(b);}

 const categories=appState.committed.categories,list=filterPrompts(records,query,filters.categoryId,appState.page==='archive',categories);
 $('result-count').textContent=list.length+' prompt'+(list.length===1?'':'s');
 if(filters.categoryId||query){const clear=action('Clear filters',()=>{appState.categoryId=null;$('search-input').value='';renderCurrent();});view.prepend(clear);}
 if(!list.length){const empty=uiText('section',null,{className:'panel'});empty.append(uiText('h2',records.length?'No matching prompts':'Your vault starts here'),uiText('p',records.length?'Try another search or clear the filters.':'Create a prompt or import a reviewed workflow bundle.'),action('Create prompt',()=>navigate('editor'),'primary'));grid.append(empty);return;}
 const fragment=document.createDocumentFragment();
 for(const p of list){
  const card=uiText('article',null,{className:'prompt-card'}),stripe=uiText('div',null,{className:'card-top-bar'}),c=categories.find(c=>c.id===p.categoryId);
  stripe.style.background=c&&/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#f5a623';
  const body=uiText('div',null,{className:'card-body'}),title=action(p.title,()=>navigate('use',p),'ghost',false);title.classList.add('card-title');
  const heading=uiText('div',null,{className:'card-heading'}),symbol=uiText('span',null,{className:'document-symbol'});symbol.append(iconsax('document-text'));heading.append(symbol,title);
  const meta=uiText('div',null,{className:'card-meta'});meta.append(iconsax('folder-open'),uiText('span',(c?.name||'Unassigned')+(p.subcategory?' / '+p.subcategory:'')));
  const snippet=uiText('div',null,{className:'card-snippet'});snippet.append(uiText('p',p.body||'',{className:'card-preview'}));body.append(heading,meta,snippet);
  if(p.workflow)body.append(uiText('span',p.workflow.reviewStatus==='approved'?'Reviewed workflow':'Draft workflow',{className:'workflow-status'}));
  const tags=uiText('div',null,{className:'card-tags'});for(const tag of p.tags||[])tags.append(uiText('span',tag,{className:'tag-chip'}));const footer=uiText('div',null,{className:'card-footer'});footer.append(tags);
  const actions=uiText('div',null,{className:'actions'});actions.append(action(p.status==='archived'?'Restore':'Use',()=>p.status==='archived'?restorePrompt(p):navigate('use',p),'primary'),action('Edit',()=>navigate('editor',p)));footer.append(actions);body.append(footer);card.append(stripe,body);fragment.append(card);
 }grid.append(fragment);
}
function renderUseView(p){
 if(!p)return navigate('library');const main=uiText('section',null,{className:'panel'}),inputs=uiText('section',null,{className:'panel'}),layout=uiText('div',null,{className:'detail-grid'});
 main.append(uiText('h2',p.title),uiText('p',p.workflow?.job||'Fill your facts, review the assembled prompt, then copy it into your chosen AI tool.'));
 const preview=uiText('pre','',{className:'prompt-body'}),validation=uiText('p','',{className:'validation'}),copy=action('Copy assembled prompt',async()=>{
  const result=assemblePrompt(p.body,p.variables,appState.useInputs);if(result.missingKeys.length||result.invalidKeys.length)return;
  try{await navigator.clipboard.writeText(result.text);announce('Copied. Review the result in your AI tool.');}catch(_){announce('Copy failed. Select the assembled text and copy manually.','error');preview.tabIndex=0;preview.focus();}
 },'primary');
 const update=()=>{const r=assemblePrompt(p.body,p.variables,appState.useInputs);preview.textContent=r.text;copy.disabled=!!(r.missingKeys.length||r.invalidKeys.length);validation.textContent=r.invalidKeys.length?'Fix template variables before use.':r.missingKeys.length?'Complete: '+r.missingKeys.join(', '):'Ready to copy. Check the preview first.';};
 inputs.append(uiText('h3','Your inputs'));for(const v of p.variables||[]){const f=field(v.label,appState.useInputs[v.key],{multiline:v.type==='multiline',required:v.required,onInput:value=>{appState.useInputs[v.key]=value;update();}});f.input.placeholder=v.example||'';inputs.append(f.wrap);}
 inputs.append(validation,copy);main.append(uiText('h3','Assembled prompt'),preview);
 if(p.workflow){for(const [label,value] of [['Review checklist',p.workflow.reviewChecklist],['Known limits',p.workflow.limits]]){main.append(uiText('h3',label));for(const line of Array.isArray(value)?value:[value||'Not specified'])main.append(uiText('p',line));}}
 const controls=uiText('div',null,{className:'actions'});controls.append(action('Edit template',()=>navigate('editor',p)),action('Version history',()=>showHistory(p)),action('Archive',()=>archivePrompt(p)));main.append(controls);layout.append(main,inputs);$('view').replaceChildren(layout);update();
}
function renderEditorView(record){
 const p=appState.draft||JSON.parse(JSON.stringify(record||{title:'',body:'',categoryId:appState.committed.categories.find(c=>c.status==='active')?.id||'',subcategory:'',tags:[],variables:[],notes:'',negativePrompt:'',model:''}));appState.draft=p;
 const panel=uiText('form',null,{className:'panel editor-form'});panel.addEventListener('submit',e=>{e.preventDefault();saveDraft();});panel.append(uiText('h2',record?'Edit prompt':'New prompt'));
 const state=uiText('p',appState.dirty?'Unsaved changes':'Template draft',{id:'save-state',className:'save-state'});panel.append(state);
 const update=(key,value)=>{p[key]=value;appState.dirty=true;state.textContent='Unsaved changes';};
 for(const [key,label,max,multiline] of [['title','Title',160,false],['body','Prompt template',20000,true],['notes','Notes',4000,true],['negativePrompt','Negative prompt',4000,true],['model','Model label',100,false]]){
  const f=field(label,p[key],{multiline,required:key==='title'||key==='body',onInput:v=>update(key,v)});f.input.maxLength=max;panel.append(f.wrap);
 }
 const category=uiText('select',null,{className:'input',id:'edit-category'}),label=uiText('label','Category',{for:'edit-category',className:'field-label'});
 for(const c of appState.committed.categories.filter(c=>c.status==='active')){const option=uiText('option',c.name);option.value=c.id;category.append(option);}category.value=p.categoryId;category.addEventListener('change',()=>{update('categoryId',category.value);p.subcategory='';});panel.append(label,category);
 const sub=field('Subcategory (existing name)',p.subcategory,{onInput:v=>update('subcategory',v)});panel.append(sub.wrap);
 const tags=field('Tags · comma separated',(p.tags||[]).join(', '),{onInput:v=>update('tags',v.split(',').map(s=>s.trim()).filter(Boolean))});panel.append(tags.wrap);
 const variablePanel=uiText('section',null,{className:'variable-editor'});
 function syncVariableFields(){
  const keys=[...new Set([...(p.body||'').matchAll(/{{([a-z][a-z0-9_]{0,31})}}/g)].map(m=>m[1]))],old=new Map((p.variables||[]).map(v=>[v.key,v]));
  p.variables=keys.map(key=>old.get(key)||{key,label:key.replaceAll('_',' '),type:'text',required:true,example:''});
  variablePanel.replaceChildren(uiText('h3','Template inputs'),uiText('p','Use {{lowercase_key}} in the template to add an input. Example text is only a hint.'));
  for(const v of p.variables){
   const row=uiText('div',null,{className:'panel'});row.append(uiText('p','Input: '+v.key));
   row.append(field('Input label',v.label,{onInput:value=>{v.label=value;update('variables',p.variables);}}).wrap,field('Example hint',v.example,{onInput:value=>{v.example=value;update('variables',p.variables);}}).wrap);
   const required=uiText('input'),id='required-'+crypto.randomUUID();required.type='checkbox';required.id=id;required.checked=v.required;required.addEventListener('change',()=>{v.required=required.checked;update('variables',p.variables);syncVariableFields();});
   const label=uiText('label','Required',{for:id});label.prepend(required);row.append(label);
   const type=uiText('select',null,{className:'input',id:'type-'+crypto.randomUUID()});for(const [value,text]of [['text','Single line'],['multiline','Multiple lines']]){const o=uiText('option',text);o.value=value;type.append(o);}type.value=v.type;type.addEventListener('change',()=>{v.type=type.value;update('variables',p.variables);});row.append(uiText('label','Input format',{for:type.id}),type);
   if(!v.required)row.append(field('Optional default · shown when left blank',v.defaultValue||'',{onInput:value=>{v.defaultValue=value;update('variables',p.variables);}}).wrap);
   variablePanel.append(row);
  }
 }
 syncVariableFields();panel.append(variablePanel);
 const bodyInput=panel.querySelector('textarea');bodyInput.addEventListener('input',syncVariableFields);
 const buttons=uiText('div',null,{className:'actions'}),save=action('Save prompt',()=>{if(panel.reportValidity())saveDraft();},'primary');save.id='save-prompt';buttons.append(save,action('Download draft',()=>downloadJson('prompt-draft.json',p)),action('Cancel',()=>navigate('library')));panel.append(buttons);$('view').replaceChildren(panel);
}
async function saveDraft(){
 const p=appState.draft;if(!p)return;
 const save=$('save-prompt'),form=save.closest('form'),controls=[...form.querySelectorAll('input,textarea,select,button')];controls.forEach(n=>n.disabled=true);appState.requestState='saving';form.setAttribute('aria-busy','true');$('save-state').textContent='Saving…';
 appState.saveIntent=createSaveIntent(p,appState.baseRecord?.revision||0,appState.saveIntent);
 const {fingerprint,...payload}=appState.saveIntent;
 try{const ack=await vaultApi.call('savePromptV2',payload);appState.dirty=false;const i=appState.committed.prompts.findIndex(x=>x.id===ack.id);if(i<0)appState.committed.prompts.unshift(ack.record);else appState.committed.prompts[i]=ack.record;appState.saveIntent=null;appState.requestState='ready';announce('Saved');await navigate('library');}
 catch(e){$('save-state').textContent=e.code==='CONFLICT'?'This prompt changed elsewhere. Your draft is retained.':'Couldn’t save. Your draft is still here.';announce(e.message,'error');
  if(e.code==='CONFLICT'){
   const box=uiText('div',null,{className:'actions'});box.append(action('Review saved version',async()=>{try{const latest=await vaultApi.call('getVaultV2'),record=latest.prompts.find(x=>x.id===p.id);openDialog({title:'Latest saved version',content:uiText('pre',JSON.stringify(record,null,2),{className:'prompt-body'})});}catch(err){announce(err.message,'error');}}),action('Save as new prompt',()=>{for(const key of ['id','revision','ownerEmail','createdBy','createdAt','modifiedAt','provenance'])delete p[key];appState.baseRecord=null;appState.saveIntent=null;saveDraft();}));$('view').append(box);
  }
 }finally{appState.requestState='ready';controls.forEach(n=>{if(n.isConnected)n.disabled=false;});form.removeAttribute('aria-busy');}
}
async function mutate(method,payload){try{await vaultApi.call(method,{operationId:crypto.randomUUID(),...payload});await loadVault();return true;}catch(e){announce(e.message,'error');return false;}}
async function archivePrompt(p){if(await confirmAction('Archive this prompt? It can be restored later.')){if(await mutate('archivePromptV2',{id:p.id,expectedRevision:p.revision}))navigate('library');}}
async function restorePrompt(p){const content=uiText('div');for(const c of appState.committed.categories.filter(c=>c.status==='active'))content.append(action(c.name,async()=>{const ok=await mutate('restorePromptV2',{id:p.id,categoryId:c.id,expectedRevision:p.revision});if(ok)document.querySelector('dialog')?.close();}));openDialog({title:'Restore to category',content});}
async function showHistory(p){try{const revisions=await vaultApi.call('getPromptHistoryV2',{id:p.id}),content=uiText('div');for(const r of revisions){const item=uiText('section',null,{className:'history-item'});item.append(uiText('h3','Version '+r.revision),uiText('p',r.modifiedAt),uiText('pre',r.body,{className:'prompt-body'}),action('Restore as new version',async()=>{if(await confirmAction('Restore this version? Current history will be preserved.')){const ok=await mutate('restorePromptVersionV2',{id:p.id,revision:r.revision,expectedRevision:p.revision});if(ok){document.querySelectorAll('dialog').forEach(d=>d.close());navigate('library');}}}));content.append(item);}openDialog({title:'Version history',content});}catch(e){announce(e.message,'error');}}
function renderCategoriesView(){
 const content=uiText('div'),create=uiText('section',null,{className:'panel'}),name=field('New category name',''),color=field('Category color','#f5a623',{type:'color'});
 create.append(uiText('h2','Categories'),name.wrap,color.wrap,action('Create category',()=>mutate('saveCategoryV2',{expectedRevision:0,record:{name:name.input.value,color:color.input.value,subcategories:[]}}),'primary'));content.append(create);
 for(const c of appState.committed.categories.filter(c=>c.status==='active')){const box=uiText('section',null,{className:'panel'}),n=field('Name',c.name),col=field('Color',c.color,{type:'color'}),subs=field('Subcategories · comma separated',c.subcategories.join(', '));box.append(n.wrap,col.wrap,subs.wrap,action('Save category',()=>mutate('saveCategoryV2',{expectedRevision:c.revision,record:{...c,name:n.input.value,color:col.input.value,subcategories:subs.input.value.split(',').map(s=>s.trim()).filter(Boolean)}})),action('Archive category',async()=>{const count=appState.committed.prompts.filter(p=>p.categoryId===c.id).length;if(await confirmAction('Archive category and its '+count+' prompts? Everything remains restorable.'))mutate('archiveCategoryV2',{id:c.id,expectedRevision:c.revision,promptPolicy:'archive'});}));content.append(box);}
 $('view').replaceChildren(content);
}
async function checksumJson(value){
 const canonical=v=>Array.isArray(v)?'['+v.map(canonical).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}':JSON.stringify(v);
 const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(value)));return [...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');
}
async function downloadArchive(method,name){
 try{let cursor=null,rows=[],first;do{const page=await vaultApi.call(method,{cursor,limit:25});if(await checksumJson(page.rows)!==page.pageChecksum)throw Error('Export page failed checksum verification.');first=first||page;if(page.vaultRevision!==first.vaultRevision||page.archiveChecksum!==first.archiveChecksum)throw Error('Vault changed during export.');rows.push(...page.rows);cursor=page.nextCursor;}while(cursor);if(await checksumJson(rows)!==first.archiveChecksum)throw Error('Export archive is incomplete.');downloadJson(name,{kind:first.kind,sourceInstall:first.sourceInstall,vaultRevision:first.vaultRevision,rows,checksum:first.archiveChecksum});announce('Verified archive downloaded.');}catch(e){announce(e.message,'error');}
}
function renderSettingsView(){
 const panel=uiText('section',null,{className:'panel'});panel.append(uiText('h2','Settings & backup'),uiText('p','Owner-only library · Schema '+(appState.committed.settings.schemaVersion||'—')),uiText('p','AI assistance and private image uploads are disabled. Backups contain attachment references, not image bytes.'));
 panel.append(action('Export current prompts & categories',async()=>{try{const bundle=await vaultApi.call('exportVaultV2'),check={...bundle};delete check.checksum;if(await checksumJson(check)!==bundle.checksum)throw Error('Export checksum does not match.');downloadJson('prompt-vault.json',bundle);announce('Current records exported. Download history and quarantine separately for complete recovery evidence.');}catch(e){announce(e.message,'error');}}),action('Export full history',()=>downloadArchive('exportHistoryV2','prompt-vault-history.json')),action('Export quarantine',()=>downloadArchive('exportQuarantineV2','prompt-vault-quarantine.json')));
 const pending=appState.committed.pendingOperation;
 if(pending){const box=uiText('section',null,{className:'panel'});box.append(uiText('h3','Unfinished '+pending.kind),uiText('p',pending.staged+' of '+pending.total+' records staged. Prior saved records are still visible.'));
  if(pending.kind==='import')box.append(action('Resume import',()=>mutate('advanceImportV2',{operationId:pending.operationId})),action('Cancel import',async()=>{if(await confirmAction('Cancel the uncommitted import? Existing saved records stay unchanged.'))mutate('cancelImportV2',{operationId:pending.operationId});}));panel.append(box);
 }
 const upload=field('Import a current-record JSON backup','',{type:'file'});upload.input.accept='.json,application/json';panel.append(uiText('h3','Preview an import'),uiText('p','Review the source and changes first. History archives require the separate clone restore guide.'),upload.wrap);
 upload.input.addEventListener('change',async()=>{try{
  const file=upload.input.files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('Choose a backup smaller than 5 MiB.');const preview=await vaultApi.call('previewImportV2',JSON.parse(await file.text())),content=uiText('div');
  content.append(uiText('p',preview.items.length+' valid records; '+preview.issues.length+' issues. Nothing has been imported.'));
  for(const issue of preview.issues)content.append(uiText('p',issue.reason+' · '+issue.id));
  const adopt=uiText('input');adopt.type='checkbox';adopt.id='adopt-copy';const al=uiText('label','Adopt foreign content as my new copies',{for:'adopt-copy'});al.prepend(adopt);content.append(al);
  const update=uiText('input');update.type='checkbox';update.id='update-matching';const ul=uiText('label','Update matching IDs only when their saved revision still matches',{for:'update-matching'});ul.prepend(update);content.append(ul);
  const intent={operationId:crypto.randomUUID(),planId:preview.planId};
  const start=action('Start reviewed import',async()=>{start.disabled=true;try{await vaultApi.call('beginImportV2',{...intent,selections:{adoptAsCopy:adopt.checked,updateMatching:update.checked}});document.querySelector('dialog')?.close();await loadVault();}catch(e){announce(e.message,'error');start.disabled=false;}});start.disabled=preview.issues.length>0;content.append(start);openDialog({title:'Review import',content});
 }catch(e){announce(e.message,'error');}});
 panel.append(action('Clear local preferences',()=>{try{localStorage.removeItem(preferenceKey());}catch(_){}announce('Local preferences cleared.');}),uiText('p','Live Google deployment tests, legacy clone migration and full-history clone restoration remain required release checks.'));
 $('view').replaceChildren(panel);
}
$('theme-btn').addEventListener('click',()=>setTheme(document.documentElement.classList.contains('dark')?'light':'dark'));
function setSidebarOpen(open){
 const mobile=matchMedia('(max-width:767px)').matches;
 $('sidebar').classList.toggle('open',mobile&&open);$('sidebar').inert=mobile&&!open;$('mobile-menu-btn').setAttribute('aria-expanded',String(mobile&&open));
 if(mobile&&open)$('sidebar-close').focus();
}
$('mobile-menu-btn').addEventListener('click',()=>setSidebarOpen(!$('sidebar').classList.contains('open')));
$('sidebar-close').addEventListener('click',()=>{setSidebarOpen(false);$('mobile-menu-btn').focus();});
$('nav-scrim').addEventListener('click',()=>setSidebarOpen(false));
matchMedia('(max-width:767px)').addEventListener('change',()=>setSidebarOpen(false));
setSidebarOpen(false);
$('new-prompt').addEventListener('click',()=>navigate('editor'));
let searchTimer;$('search-input').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(['library','archive'].includes(appState.page))renderCurrent();else navigate('library');},150);});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('search-input').focus();}if(e.key==='Escape'){setSidebarOpen(false);}});
window.addEventListener('beforeunload',e=>{if(appState.dirty){e.preventDefault();e.returnValue='';}});
$('sidebar-close').append(iconsax('close-square'));$('brand-symbol').append(iconsax('book'));$('search-symbol').append(iconsax('search-normal'));$('theme-btn').append(iconsax('moon'));$('mobile-menu-btn').append(iconsax('menu'));$('new-prompt').prepend(iconsax('add'));
const demoNotice=document.querySelector('.demo-notice');if(demoNotice){demoNotice.textContent='Demo · sample data · local changes only';demoNotice.title='Changes stay in local server memory. No Google or AI calls.';}
loadVault();
</script>
